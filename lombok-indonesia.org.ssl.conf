<VirtualHost 199.250.209.229:8443>
	ServerName lombok-indonesia.org
	ServerAlias www.lombok-indonesia.org
	ServerAdmin webmaster@lombok-indonesia.org
	DocumentRoot /home/chitim6/lombok-indonesia.org/
	UseCanonicalName Off
	ScriptAlias /cgi-bin/ /home/chitim6/lombok-indonesia.org//cgi-bin/

	#CustomLog /usr/local/apache/domlogs/lombok-indonesia.org.bytes bytes
	#CustomLog /usr/local/apache/domlogs/lombok-indonesia.org.log combined
	ErrorLog /usr/local/apache/domlogs/lombok-indonesia.org.error.log

	# Custom settings are loaded below this line (if any exist)
	# IncludeOptional "/usr/local/apache/conf/userdata/chitim6/lombok-indonesia.org/*.conf"

	SSLEngine on
	SSLCertificateFile /etc/pki/tls/certs/lombok-indonesia.org.cert
	SSLCertificateKeyFile /etc/pki/tls/private/lombok-indonesia.org.key
	SSLCertificateChainFile /etc/pki/tls/certs/lombok-indonesia.org.bundle
	SetEnvIf User-Agent ".*MSIE.*" nokeepalive ssl-unclean-shutdown

	<IfModule mod_userdir.c>
		UserDir disabled
		UserDir enabled chitim6
	</IfModule>

	<IfModule mod_suexec.c>
		SuexecUserGroup chitim6 chitim6
	</IfModule>

	<IfModule mod_suphp.c>
		suPHP_UserGroup chitim6 chitim6
		suPHP_ConfigPath /home/chitim6
	</IfModule>

	<IfModule mod_ruid2.c>
		RMode config
		RUidGid chitim6 chitim6
	</IfModule>

	<IfModule itk.c>
		AssignUserID chitim6 chitim6
	</IfModule>

	<Directory "/home/chitim6/lombok-indonesia.org/">
		Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
		AllowOverride All Options=ExecCGI,Includes,IncludesNOEXEC,Indexes,MultiViews,SymLinksIfOwnerMatch
		SSLRequireSSL
	</Directory>

	<IfModule proxy_fcgi_module>
		<FilesMatch \.php$>
			SetHandler "proxy:unix:/opt/alt/php-fpm83/usr/var/sockets/chitim6.sock|fcgi://localhost"
		</FilesMatch>
	</IfModule>

	# FastAPI application proxy for /myapp subpath
	<IfModule mod_proxy.c>
		ProxyRequests Off
		ProxyPreserveHost On
		ProxyVia Full
		
		# Proxy /myapp requests to FastAPI application
		ProxyPass /myapp/ http://127.0.0.1:8000/
		ProxyPassReverse /myapp/ http://127.0.0.1:8000/
		
		<Proxy *>
			AllowOverride All
		</Proxy>
	</IfModule>

	 #  Cloudflare image redirect
        <IfModule mod_rewrite.c>
	  RewriteEngine On

          # Only apply to missing physical files
          RewriteCond %{REQUEST_FILENAME} !-f

	  # Match image requests like /wp-content/uploads/2025/02/example.jpg
	  RewriteCond %{REQUEST_URI} ^/wp-content/uploads/(\d{4})/(\d{2})/([^/]+\.(jpg|jpeg|png|webp|gif|svg))$ [NC]

	  # Redirect to Cloudflare format: 2025_02_example.jpg
	  RewriteRule ^wp-content/uploads/(\d{4})/(\d{2})/([^/]+\.(jpg|jpeg|png|webp|gif|svg))$ https://imagedelivery.net/DXvOmU3IRRa6gYmKxAGM6g/%1_%2_%3 [R=302,L]
	</IfModule>
</VirtualHost>

